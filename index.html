<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>目標マンダラチャート</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <style>
    :root {
      color: #173452;
      background: #f4f7fb;
      font-family: system-ui, sans-serif;
    }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      place-items: center;
    }
    main {
      box-sizing: border-box;
      width: min(100%, 30rem);
      padding: 2rem 1.25rem;
      text-align: center;
    }
    h1 { font-size: clamp(1.45rem, 5vw, 2rem); margin: 1rem 0; }
    img { display: block; width: 88px; height: 88px; margin: auto; border-radius: 19px; }
    p { margin: 1rem 0 0; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" width="88" height="88">
    <h1>目標マンダラチャート</h1>
    <p id="launch-message" role="status">起動リンクを確認しています。</p>
  </main>
  <script>
    const approvedDigest = '007d9741c8729a2a7322538bb179fd3c5b6c0764304116ff5810c656c0276bab';
    const message = document.querySelector('#launch-message');

    async function launch() {
      const currentUrl = new URL(location.href);
      const fragment = currentUrl.hash;
      const deploymentId = fragment.slice(1);
      const setup = currentUrl.search === '?setup=1';
      if ((!setup && currentUrl.search) || !/^AKfycb[A-Za-z0-9_-]{66}$/.test(deploymentId) || !crypto.subtle) {
        message.textContent = '指定された起動用リンクを開いてください。';
        return;
      }

      message.textContent = '起動リンクを確認しています。';
      const digestBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(deploymentId));
      const digest = Array.from(new Uint8Array(digestBytes), byte => byte.toString(16).padStart(2, '0')).join('');
      if (currentUrl.href !== location.href) return;
      if (digest !== approvedDigest) {
        message.textContent = '指定された起動用リンクを開いてください。';
        return;
      }

      if (setup) {
        currentUrl.search = '';
        history.replaceState(null, '', currentUrl.href);
        message.textContent = 'Safariの共有メニューから「ホーム画面に追加」を選ぶか、このページをブックマークに登録してください。';
        return;
      }

      message.textContent = 'チャートを開いています。';
      location.replace('https://script.google.com/macros/s/' + deploymentId + '/exec');
    }

    function checkLaunch() {
      launch().catch(() => {
        message.textContent = '起動リンクを確認できませんでした。';
      });
    }

    window.addEventListener('hashchange', checkLaunch);
    checkLaunch();
  </script>
</body>
</html>
